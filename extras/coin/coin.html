:root{--hero-muted:#B7C0C8;--serif:"EB Garamond",Georgia,serif;--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10253A;font-family:var(--sans)}
/* ============ Münze (3D) ============ */
.coin-stage{--d:clamp(230px,32vw,370px);--t:calc(var(--d)*.085);--r:calc(var(--d)/2);
  --seg:calc(var(--d)*3.1416/48 + 1.2px);
  width:var(--d);height:var(--d);margin-inline:auto;perspective:1200px;perspective-origin:50% 45%}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform;
  transform:rotateX(9deg) rotateY(-27deg);animation:sway 11s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateX(9deg) rotateY(-31deg)}50%{transform:rotateX(5deg) rotateY(-20deg)}}
.coin-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;overflow:hidden}
.coin-front{transform:translateZ(calc(var(--t)/2));
  box-shadow:0 0 0 1px rgba(90,68,25,.55),0 26px 50px rgba(0,0,0,.45)}
.coin-back{transform:rotateY(180deg) translateZ(calc(var(--t)/2));
  background:radial-gradient(circle at 36% 30%,#EBD9AE,#C2A063 55%,#8E7134)}
.coin-face svg{display:block;width:100%;height:100%}
.rim{position:absolute;inset:0;transform-style:preserve-3d}
.rim i{position:absolute;left:50%;top:50%;width:var(--seg);height:var(--t);
  margin-left:calc(var(--seg)/-2);margin-top:calc(var(--t)/-2);
  transform:rotateZ(calc(var(--i)*7.5deg)) translateX(var(--r)) rotateY(90deg) rotateZ(90deg);
  backface-visibility:hidden;
  background:linear-gradient(90deg,#856828,#DCC183 20%,#F3E3B9 46%,#C1A05C 74%,#7A5E26);
  display:flex;align-items:center;justify-content:center;
  font:600 calc(var(--t)*.5)/1 var(--sans);color:#6B5320;letter-spacing:.02em;
  text-shadow:0 1px 0 rgba(255,246,222,.5)}
.rim i::before{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,248,226,.55) 0 1px,rgba(96,74,30,.4) 1px 2.4px)}
.glint{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden;
  transform:translateZ(calc(var(--t)/2 + .6px))}
.glint::after{content:"";position:absolute;top:-60%;bottom:-60%;width:46%;left:-60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1) 25%,rgba(255,255,255,.72),rgba(255,255,255,.1) 75%,transparent);
  transform:rotate(19deg);mix-blend-mode:screen;animation:glint 2s linear infinite}
@keyframes glint{0%{left:-60%}26%{left:118%}100%{left:118%}}
.coin-cap{margin-top:22px;text-align:center;font-size:.82rem;color:var(--hero-muted);
  letter-spacing:.08em;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){.coin{animation:none}.glint::after{animation:none;opacity:.35;left:20%}}
