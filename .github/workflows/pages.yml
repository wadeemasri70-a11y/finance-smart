# Rebuilds the pages from src/body.html and checks the result.
#
# The finished site sits at the repository root, so a plain
# "Deploy from a branch -> / (root)" Pages setting serves it as-is; this
# workflow only guards against a stale or half-built page being committed.
name: Check the built site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the pages from src/body.html
        run: python3 src/build.py

      - name: The committed pages must match a fresh build
        run: |
          if ! git diff --quiet; then
            echo "::error::a committed page differs from what src/build.py produces"
            git diff --stat
            exit 1
          fi
          echo "every page matches a fresh build"

      - name: No page may ship an unreplaced placeholder
        run: |
          set -e
          for f in *.html; do
            if grep -q '__I18N_DICT__' "$f"; then
              echo "::error file=$f::translation placeholder was never replaced"
              exit 1
            fi
          done
          test -s index.html && test -f .nojekyll
          echo "index.html and .nojekyll present, no placeholders"
